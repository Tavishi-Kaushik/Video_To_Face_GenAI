seed: 42

data:
  csv_path: data/processed/pairs.csv
  image_size: 64
  n_mels: 80
  max_frames: 128
  batch_size: 32
  num_workers: 2
  val_split: 0.1

model:
  audio_embedding_dim: 128
  latent_dim: 64
  image_channels: 3
  base_channels: 32

train:
  epochs: 20
  learning_rate: 0.0002
  beta_kl: 0.001
  device: cuda
  checkpoint_dir: data/checkpoints
  sample_dir: outputs/samples
  log_every: 50
  sample_every_epoch: 1

infer:
  output_size: 64
